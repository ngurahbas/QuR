services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: qur_user
      POSTGRES_PASSWORD: qur_password
      POSTGRES_DB: qur_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_qur_data:/var/lib/postgresql
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
      POSTGRES_DB: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_ADMIN_URL: http://localhost:8081
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-postgres
    restart: unless-stopped
    command: start-dev

  keycloak-init:
    image: alpine/curl:latest
    depends_on:
      - keycloak
    volumes:
      - ./keycloak/setup-keycloak.sh:/tmp/setup-keycloak.sh:z
    command: >
      sh -c "sh /tmp/setup-keycloak.sh"
    restart: "no"

volumes:
  postgres_qur_data:
  keycloak_postgres_data:
