version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: qur_user
      POSTGRES_PASSWORD: qur_password
      POSTGRES_DB: qur_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qur_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: